# Configuracion del servidor
server.port=8085
spring.application.name=ms-notificaciones

# Configuracion H2 - Base de datos relacional embebida
spring.datasource.url=jdbc:h2:file:./data/db_notificaciones;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web H2 (para mostrar datos en el video)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
